[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Redirects ────────────────────────────────────────────────────────────────
# The "technology" tag was folded into "tech"; keep the old URL alive.
# Uppercase tag URLs (/tags/AI, /tags/NYC) already resolve via Netlify's
# case-insensitive path fallback, so they need no rule here.
[[redirects]]
  from = "/tags/technology"
  to = "/tags/tech"
  status = 301
  force = true

[[redirects]]
  from = "/tags/technology/*"
  to = "/tags/tech"
  status = 301
  force = true

# ── Security headers ─────────────────────────────────────────────────────────
# Applied to every response. The CSP is deliberately shaped around what the
# site actually loads: inline Astro scripts/styles, the Iconify web component
# and its icon API, Pagefind's WebAssembly search index, YouTube embeds in
# project writeups, and images hotlinked from GitHub/Medium in older posts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = """
      default-src 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'; \
      form-action 'self'; \
      script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://code.iconify.design; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: https:; \
      font-src 'self'; \
      connect-src 'self' https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; \
      frame-src https://www.youtube.com https://www.youtube-nocookie.com; \
      worker-src 'self' blob:; \
      manifest-src 'self'; \
      upgrade-insecure-requests"""

# Fingerprinted build output is immutable; let it cache hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
